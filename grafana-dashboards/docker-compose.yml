# Self-contained sample-data stack for grafana-dashboards/ - separate from
# demo-cert-monitoring/'s docker-compose.yml (unrelated demo, different
# purpose). It's a demo, so all four exporters here are synthetic sample
# data (mock-exporters/*.py) - no real Apache/SQL Server/node/vCenter
# needed to see the dashboards populated. Each mock uses the same metric
# names as the real exporter it mimics, so swapping in the real thing
# later needs no dashboard changes - see the docstring at the top of each
# mock-exporters/*.py file for exactly what's faked and why.
#
# Start with: docker compose -f grafana-dashboards/docker-compose.yml up -d
# Then: run fetch-community-dashboards.sh (see README.md) before first
# start so dashboards/ isn't empty, or import dashboards by ID/URL
# directly in the Grafana UI once it's up.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: itops-dashboards-prometheus
    restart: unless-stopped
    depends_on:
      - node-mock-exporter
      - apache-mock-exporter
      - mssql-mock-exporter
      - vmware-mock-exporter
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: itops-dashboards-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me-please}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  # ── Systemadmins: Node Exporter Full - synthetic sample data ────────────────
  node-mock-exporter:
    image: python:3.12-alpine
    container_name: itops-dashboards-node-mock
    restart: unless-stopped
    volumes:
      - ./mock-exporters/node_mock_exporter.py:/node_mock_exporter.py:ro
    entrypoint: ["python3", "/node_mock_exporter.py"]
    ports:
      - "${NODE_MOCK_PORT:-9100}:9100"

  # ── Webserver-Admins: Apache2 - synthetic sample data ───────────────────────
  apache-mock-exporter:
    image: python:3.12-alpine
    container_name: itops-dashboards-apache-mock
    restart: unless-stopped
    volumes:
      - ./mock-exporters/apache_mock_exporter.py:/apache_mock_exporter.py:ro
    entrypoint: ["python3", "/apache_mock_exporter.py"]
    ports:
      - "${APACHE_MOCK_PORT:-9117}:9117"

  # ── DB-Admins: MS SQL Server - synthetic sample data ────────────────────────
  mssql-mock-exporter:
    image: python:3.12-alpine
    container_name: itops-dashboards-mssql-mock
    restart: unless-stopped
    volumes:
      - ./mock-exporters/mssql_mock_exporter.py:/mssql_mock_exporter.py:ro
    entrypoint: ["python3", "/mssql_mock_exporter.py"]
    ports:
      - "${MSSQL_MOCK_PORT:-9399}:9399"

  # ── Systemadmins: VMware host - synthetic sample data ───────────────────────
  vmware-mock-exporter:
    image: python:3.12-alpine
    container_name: itops-dashboards-vmware-mock
    restart: unless-stopped
    volumes:
      - ./mock-exporters/vmware_mock_exporter.py:/vmware_mock_exporter.py:ro
    entrypoint: ["python3", "/vmware_mock_exporter.py"]
    ports:
      - "${VMWARE_MOCK_PORT:-9272}:9272"

volumes:
  prometheus_data:
  grafana_data:
