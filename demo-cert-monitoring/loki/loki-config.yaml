# Minimal single-process Loki config for this demo: local filesystem
# storage, no object store/auth needed. Standard "getting started"
# monolithic-mode shape (schema v13 + tsdb, the current recommended
# default) - not tuned for production, just enough to hold the DocuWare
# demo log volume.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Demo has one label set per service (4 streams) at low volume - default
  # ingestion-rate limits are tuned for production fleets and would just
  # add noise here.
  allow_structured_metadata: true
