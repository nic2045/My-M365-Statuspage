server {
    listen 443 ssl;
    server_name demo-broken-site.local;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    location / {
        default_type text/plain;
        return 200 "Demo-Website mit absichtlich abgelaufenem TLS-Zertifikat.\nDient dem Durchspielen des Zertifikats-Ablauf-Vorfalls im Monitoring-Stack.\n";
    }
}
