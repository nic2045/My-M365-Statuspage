# Eigenständiger Demo-Stack: Zertifikats- & Verfügbarkeits-Monitoring.
#
# - Prometheus + blackbox_exporter: probt DEMO_TARGET_URLS (HTTP-Check +
#   TLS-Zertifikats-Ablauf) und ist die einzige Quelle der Wahrheit.
# - Grafana: technisches Dashboard für App-Owner (Response-Time,
#   Zertifikats-Countdown, Alarm-Schwellen).
# - oneuptime-sync: optionaler Brückendienst, der Prometheus-Ergebnisse an
#   OneUptime-Heartbeat-Monitore meldet, damit die öffentliche Statuspage
#   für Endnutzer denselben Stand zeigt. Ohne ONEUPTIME_HEARTBEAT_URLS in
#   .env läuft er einfach nicht mit.
# - demo-broken-site: feste Demo-Fixture mit absichtlich abgelaufenem
#   TLS-Zertifikat (DEMO_CERT_DAYS_REMAINING), damit sich ein echter
#   Zertifikats-Vorfall durch den gesamten Stack verfolgen lässt:
#   blackbox_exporter -> Prometheus/Alert -> Grafana -> oneuptime-sync ->
#   OneUptime-Statuspage.
#
# Unabhängig vom Haupt-docker-compose.yml der M365-Statuspage-App -
# separat starten mit: docker compose -f demo-cert-monitoring/docker-compose.yml up -d

services:
  target-init:
    image: alpine:3.20
    container_name: cert-demo-target-init
    env_file:
      - .env
    volumes:
      - ./scripts/gen-targets.sh:/gen-targets.sh:ro
      - prometheus_targets:/etc/prometheus/targets
    entrypoint: ["sh", "/gen-targets.sh"]
    restart: "no"

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: cert-demo-blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "${BLACKBOX_EXPORTER_PORT:-9115}:9115"

  demo-cert-init:
    image: alpine:3.20
    container_name: cert-demo-cert-init
    env_file:
      - .env
    volumes:
      - ./scripts/gen-demo-cert.sh:/gen-demo-cert.sh:ro
      - demo_cert_data:/certs
    entrypoint: ["sh", "/gen-demo-cert.sh"]
    restart: "no"

  demo-broken-site:
    image: nginx:1.27-alpine
    container_name: cert-demo-broken-site
    restart: unless-stopped
    depends_on:
      demo-cert-init:
        condition: service_completed_successfully
    volumes:
      - ./demo-broken-site/default.conf:/etc/nginx/conf.d/default.conf:ro
      - demo_cert_data:/certs:ro
    ports:
      - "${DEMO_BROKEN_SITE_PORT:-8443}:443"

  demo-docuware-site:
    # Local fixture standing in for "docuware.pyur.com" - plain HTTP,
    # always healthy. Deliberately NOT a real network call to any real
    # pyur.com host: Prometheus relabels its instance to the display name
    # below (same trick as demo-broken-site), so the demo shows the label
    # without ever contacting the real domain.
    image: nginx:1.27-alpine
    container_name: cert-demo-docuware-site
    restart: unless-stopped
    volumes:
      - ./demo-docuware-site/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DEMO_DOCUWARE_SITE_PORT:-8080}:80"

  docuware-metrics-exporter:
    # Synthetic Prometheus exporter simulating the DocuWare cluster's
    # WAF/IIS/MSSQL/VMware/hardware layer - see scripts/docuware-metrics-exporter.py.
    image: python:3.12-alpine
    container_name: cert-demo-docuware-metrics
    restart: unless-stopped
    volumes:
      - ./scripts/docuware-metrics-exporter.py:/docuware-metrics-exporter.py:ro
    entrypoint: ["python3", "/docuware-metrics-exporter.py"]
    ports:
      - "${DOCUWARE_METRICS_PORT:-9200}:9200"

  mailpit:
    # Local mail catcher: lets OneUptime send REAL emails (real SMTP
    # handshake, real subscriber-notification job) that land in a web
    # inbox here instead of a static mockup - see seed-oneuptime.sh
    # (configures OneUptime's Global SMTP + a demo subscriber) and
    # break-demo.sh (the live trigger). No real mail ever leaves this
    # machine.
    image: axllent/mailpit:latest
    container_name: cert-demo-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  customer-care-metrics-exporter:
    # Synthetic Prometheus exporter simulating the distributed
    # Customer-Care service (Avaya ACD/SIP, Citrix, support/billing apps,
    # Cognigy, and 6 sites' site-to-site VPN links into the Leipzig
    # datacenter) - see scripts/customer-care-metrics-exporter.py.
    image: python:3.12-alpine
    container_name: cert-demo-customer-care-metrics
    restart: unless-stopped
    volumes:
      - ./scripts/customer-care-metrics-exporter.py:/customer-care-metrics-exporter.py:ro
    entrypoint: ["python3", "/customer-care-metrics-exporter.py"]
    ports:
      - "${CUSTOMER_CARE_METRICS_PORT:-9300}:9300"

  leipzig-network-metrics-exporter:
    # Synthetic Prometheus exporter for the Standort Leipzig LAN itself
    # (distinct from the Customer-Care S2S-VPN links above): one core
    # switch in the basement, one internet router, 10 access switches
    # across 4 areas on one floor - see scripts/leipzig-network-exporter.py.
    image: python:3.12-alpine
    container_name: cert-demo-leipzig-network-metrics
    restart: unless-stopped
    environment:
      METRICS_PORT: "9400"
    volumes:
      - ./scripts/leipzig-network-exporter.py:/leipzig-network-exporter.py:ro
    entrypoint: ["python3", "/leipzig-network-exporter.py"]
    ports:
      - "${LEIPZIG_NETWORK_METRICS_PORT:-9400}:9400"

  webshop-metrics-exporter:
    # Synthetic Prometheus exporter for the webshop - a cross-functional
    # overview (Marketing, Website-Betrieb, Middleware, Infra) rather than
    # a single team's dashboard, see scripts/webshop-metrics-exporter.py.
    image: python:3.12-alpine
    container_name: cert-demo-webshop-metrics
    restart: unless-stopped
    environment:
      METRICS_PORT: "9500"
    volumes:
      - ./scripts/webshop-metrics-exporter.py:/webshop-metrics-exporter.py:ro
    entrypoint: ["python3", "/webshop-metrics-exporter.py"]
    ports:
      - "${WEBSHOP_METRICS_PORT:-9500}:9500"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cert-demo-prometheus
    restart: unless-stopped
    depends_on:
      target-init:
        condition: service_completed_successfully
      blackbox_exporter:
        condition: service_started
      demo-broken-site:
        condition: service_started
      demo-docuware-site:
        condition: service_started
      docuware-metrics-exporter:
        condition: service_started
      customer-care-metrics-exporter:
        condition: service_started
      leipzig-network-metrics-exporter:
        condition: service_started
      webshop-metrics-exporter:
        condition: service_started
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: cert-demo-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  oneuptime-sync:
    image: alpine:3.20
    container_name: cert-demo-oneuptime-sync
    # on-failure statt unless-stopped: ohne ONEUPTIME_*-Heartbeat-URLs in
    # .env beendet sich das Sync-Skript planmaessig mit Exit 0. Mit
    # unless-stopped wuerde Docker diesen sauberen Exit endlos neu starten
    # und der Container saehe faelschlich nach Dauer-Crash aus.
    restart: on-failure
    depends_on:
      - prometheus
    env_file:
      - .env
    environment:
      PROM_URL: http://prometheus:9090
    # The OneUptime heartbeat URLs point at the host (OneUptime runs in its
    # own compose project, not on this network). Docker Desktop resolves
    # host.docker.internal on its own; on Linux this mapping is what makes
    # the same name work.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./scripts/oneuptime-sync.sh:/oneuptime-sync.sh:ro
    entrypoint: ["sh", "/oneuptime-sync.sh"]

volumes:
  prometheus_targets:
  prometheus_data:
  grafana_data:
  demo_cert_data:
