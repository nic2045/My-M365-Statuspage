groups:
  - name: website-and-certificate-alerts
    rules:
      # `for:` durations are kept short (1-5m) so a live demo (via
      # break-demo.sh) shows alerts firing quickly. In production, use
      # longer values to avoid flapping on transient blips.
      - alert: WebsiteDown
        expr: probe_success{job=~"website_probes|demo_broken_site"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} ist nicht erreichbar"
          description: "Der HTTP(S)-Check für {{ $labels.instance }} schlägt seit mehr als 1 Minute fehl."

      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job=~"website_probes|demo_broken_site"} - time()) / 86400 < 14
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TLS-Zertifikat für {{ $labels.instance }} läuft bald ab"
          description: "Das Zertifikat für {{ $labels.instance }} läuft in weniger als 14 Tagen ab."

      - alert: CertificateExpiringCritical
        expr: (probe_ssl_earliest_cert_expiry{job=~"website_probes|demo_broken_site"} - time()) / 86400 < 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TLS-Zertifikat für {{ $labels.instance }} läuft in Kürze ab oder ist abgelaufen"
          description: "Das Zertifikat für {{ $labels.instance }} läuft in weniger als 3 Tagen ab (negative Werte = bereits abgelaufen)."
