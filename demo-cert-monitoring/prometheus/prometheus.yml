global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "blackbox_exporter"
    static_configs:
      - targets: ["blackbox_exporter:9115"]

  # Website-Erreichbarkeit + TLS-Zertifikatsprüfung (http_2xx-Modul liefert
  # bei HTTPS-Zielen automatisch probe_ssl_earliest_cert_expiry mit).
  - job_name: "website_probes"
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/http_targets.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      # outlook.office.com genuinely is up but returns HTTP 417 to a plain
      # synthetic GET (confirmed with a real browser User-Agent too - a
      # Microsoft edge/WAF quirk, not an outage) - override just this one
      # target to the module that also accepts 417, so the demo doesn't
      # show a real, working service as down. Everything else keeps the
      # strict default module set via `params.module` above.
      - source_labels: [__param_target]
        regex: '.*outlook\.office\.com.*'
        target_label: __param_module
        replacement: http_2xx_or_ms_417
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # Feste Demo-Fixture (demo-broken-site): eigenes Modul mit
  # insecure_skip_verify, damit probe_ssl_earliest_cert_expiry auch bei
  # abgelaufenem/selbstsigniertem Zertifikat zuverlässig ausgelesen wird -
  # unabhängig davon, ob TLS-Verifikation die Verbindung selbst ablehnen
  # würde. So lässt sich "Zertifikat läuft ab" sauber von "Site nicht
  # erreichbar" unterscheiden. Per break-demo.sh / fix-demo.sh live
  # umschaltbar, kein Neustart von Prometheus nötig.
  - job_name: "demo_broken_site"
    metrics_path: /probe
    params:
      module: [https_expired_cert_demo]
    static_configs:
      - targets: ["https://demo-broken-site"]
        labels:
          demo_fixture: "true"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: "demo-broken-site (absichtlich abgelaufenes Zertifikat)"
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # DocuWare-Demo: Fixture-Erreichbarkeit (docuware.pyur.com-Label, echte
  # Anfrage geht an die lokale demo-docuware-site-Fixture - siehe
  # demo-docuware-site/ und docker-compose.yml).
  - job_name: "docuware_site"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://demo-docuware-site"]
        labels:
          demo_fixture: "docuware"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: "docuware.pyur.com"
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # DocuWare-Demo: synthetischer Cluster-Metrics-Exporter (WAF/IIS/MSSQL/
  # VMware/Hardware) - direkt gescraped, kein blackbox-Umweg, siehe
  # scripts/docuware-metrics-exporter.py.
  - job_name: "docuware_cluster"
    static_configs:
      - targets: ["docuware-metrics-exporter:9200"]
        labels:
          instance: "docuware-cluster"

  # Customer-Care-Demo: synthetischer Exporter fuer Telefonie (Avaya ACD/
  # SIP), Citrix, Kundensupport-/Rechnungswesen-App, Cognigy und die
  # Standort-VPN-Strecken - siehe scripts/customer-care-metrics-exporter.py.
  - job_name: "customer_care"
    static_configs:
      - targets: ["customer-care-metrics-exporter:9300"]
        labels:
          instance: "customer-care-cluster"

  # Standort-Leipzig-LAN: Core-Switch (Keller), Internet-Router, 10
  # Access-Switches auf einer Etage - siehe scripts/leipzig-network-exporter.py.
  - job_name: "leipzig_network"
    static_configs:
      - targets: ["leipzig-network-metrics-exporter:9400"]
        labels:
          instance: "leipzig-lan"

  # shop.pyur.com: Gruppe aus fünf Dashboards (Health & Business, Frontend
  # Observability inkl. Vertragsabschluss-Funnel, Infrastruktur, Datenbank-
  # Performance, Web-Traffic & Fehlercodes) - siehe
  # scripts/webshop-metrics-exporter.py.
  - job_name: "webshop"
    static_configs:
      - targets: ["webshop-metrics-exporter:9500"]
        labels:
          instance: "shop.pyur.com"
