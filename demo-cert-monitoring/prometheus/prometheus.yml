global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "blackbox_exporter"
    static_configs:
      - targets: ["blackbox_exporter:9115"]

  # Website-Erreichbarkeit + TLS-Zertifikatsprüfung (http_2xx-Modul liefert
  # bei HTTPS-Zielen automatisch probe_ssl_earliest_cert_expiry mit).
  - job_name: "website_probes"
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/http_targets.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # Feste Demo-Fixture (demo-broken-site): eigenes Modul mit
  # insecure_skip_verify, damit probe_ssl_earliest_cert_expiry auch bei
  # abgelaufenem/selbstsigniertem Zertifikat zuverlässig ausgelesen wird -
  # unabhängig davon, ob TLS-Verifikation die Verbindung selbst ablehnen
  # würde. So lässt sich "Zertifikat läuft ab" sauber von "Site nicht
  # erreichbar" unterscheiden. Per break-demo.sh / fix-demo.sh live
  # umschaltbar, kein Neustart von Prometheus nötig.
  - job_name: "demo_broken_site"
    metrics_path: /probe
    params:
      module: [https_expired_cert_demo]
    static_configs:
      - targets: ["https://demo-broken-site"]
        labels:
          demo_fixture: "true"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: "demo-broken-site (absichtlich abgelaufenes Zertifikat)"
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # DocuWare-Demo: Fixture-Erreichbarkeit (docuware.pyur.com-Label, echte
  # Anfrage geht an die lokale demo-docuware-site-Fixture - siehe
  # demo-docuware-site/ und docker-compose.yml).
  - job_name: "docuware_site"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://demo-docuware-site"]
        labels:
          demo_fixture: "docuware"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: "docuware.pyur.com"
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # DocuWare-Demo: synthetischer Cluster-Metrics-Exporter (WAF/IIS/MSSQL/
  # VMware/Hardware) - direkt gescraped, kein blackbox-Umweg, siehe
  # scripts/docuware-metrics-exporter.py.
  - job_name: "docuware_cluster"
    static_configs:
      - targets: ["docuware-metrics-exporter:9200"]
        labels:
          instance: "docuware-cluster"
